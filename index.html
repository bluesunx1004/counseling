<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 캘린더 | 학급 상담 포트폴리오</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
<header class="app-header">
  <div class="brand">학급 상담 포트폴리오</div>
  <nav class="app-nav">
    <a href="index.html" class="active">상담 캘린더</a>
    <a href="reservation.html">일정 예약</a>
    <a href="upload.html">상담 입력 및 업로드</a>
    <a href="portfolio.html">학생별 포트폴리오</a>
    <a href="students.html">학생 명단</a>
  </nav>
</header>

<main>
  <h1>상담 캘린더</h1>
  <p class="page-desc">전체 학생의 상담 일정을 한눈에 확인합니다. 일정을 클릭하면 해당 학생의 포트폴리오로 이동합니다.</p>

  <div class="legend">
    <span><i style="background:var(--status-pending)"></i>신청 대기</span>
    <span><i style="background:var(--status-confirmed)"></i>확정</span>
    <span><i style="background:var(--status-done)"></i>상담 완료</span>
    <span><i style="background:var(--status-cancelled)"></i>취소/미진행</span>
  </div>

  <div id="calendar"></div>
</main>

<!-- 일정 클릭 시 뜨는 상세 패널 -->
<div id="eventModalBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;">
  <div class="card" style="max-width:420px;margin:80px auto;">
    <h2 id="em-title">상담 상세</h2>
    <div id="em-body"></div>
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn" id="em-goto">학생 포트폴리오 보기</button>
      <button class="btn secondary" id="em-close">닫기</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
