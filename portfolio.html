<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생별 포트폴리오 | 학급 상담 포트폴리오</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header no-print">
  <div class="brand">학급 상담 포트폴리오</div>
  <nav class="app-nav">
    <a href="index.html">상담 캘린더</a>
    <a href="reservation.html">일정 예약</a>
    <a href="upload.html">상담 입력 및 업로드</a>
    <a href="portfolio.html" class="active">학생별 포트폴리오</a>
    <a href="students.html">학생 명단</a>
  </nav>
</header>

<main>
  <div class="card no-print">
    <label for="studentSelect">학생 선택</label>
    <select id="studentSelect"></select>
  </div>

  <div id="content"></div>
</main>

<!-- 상담 기록 수정 모달 -->
<div id="editModalBg" class="no-print" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;overflow:auto;">
  <div class="card" style="max-width:560px;margin:48px auto;">
    <h2>상담 기록 수정</h2>
    <input type="hidden" id="edit-logId">
    <label for="edit-date">상담 일자</label>
    <input type="date" id="edit-date">
    <label for="edit-topic">핵심 상담 주제</label>
    <textarea id="edit-topic"></textarea>
    <label for="edit-student">학생 발언 요약</label>
    <textarea id="edit-student"></textarea>
    <label for="edit-teacher">교사 지도 및 조언 내용</label>
    <textarea id="edit-teacher"></textarea>
    <label for="edit-followup">추후 지도 계획</label>
    <textarea id="edit-followup"></textarea>
    <label for="edit-memo">교사 메모(원문)</label>
    <textarea id="edit-memo"></textarea>
    <div id="edit-msg" class="msg" style="display:none;"></div>
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn" id="edit-save">저장</button>
      <button class="btn secondary" id="edit-cancel">취소</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/portfolio.js"></script>
</body>
</html>
